name: Build Latch MCP

on:
  push:
    paths:
      - 'latch/**'
      - '.github/workflows/build-latch.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build latch.exe (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: latch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            latch/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('latch/Cargo.lock') }}

      - name: Build release (optimized, stripped)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: latch-windows-x64
          path: latch/target/x86_64-pc-windows-msvc/release/latch.exe
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/latch-v')
        uses: softprops/action-gh-release@v2
        with:
          files: latch/target/x86_64-pc-windows-msvc/release/latch.exe
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
