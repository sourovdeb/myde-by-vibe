<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Double Control v2.1</title>
  <style>
    body {
      width: 420px;
      max-height: 650px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      overflow-y: auto;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 10px 0;
      color: #333;
    }
    h2 {
      font-size: 13px;
      margin: 12px 0 6px 0;
      color: #555;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
    .tabs-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
    .tab-item {
      padding: 6px;
      margin: 3px 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .tab-item:hover { background: #e3f2fd; }
    .tab-item.active {
      background: #2196f3;
      color: white;
      border-color: #1976d2;
    }
    .tab-title { font-weight: bold; margin-bottom: 2px; }
    .tab-url { font-size: 11px; color: #666; word-break: break-all; }
    .tab-item.active .tab-url { color: #e3f2fd; }
    .status {
      padding: 8px;
      background: #4caf50;
      color: white;
      text-align: center;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      padding: 6px 10px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 4px 4px 0 0;
      font-size: 12px;
    }
    button:hover { background: #1976d2; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    .mcp-status {
      margin-top: 6px;
      padding: 6px;
      font-size: 11px;
      border-radius: 4px;
      background: #eee;
      color: #333;
      font-family: monospace;
    }
    .mcp-ok { background: #e8f5e9; color: #2e7d32; }
    .mcp-down { background: #ffebee; color: #c62828; }
    .mcp-warn { background: #fff8e1; color: #f57f17; }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      padding: 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .toggle-label { font-size: 13px; font-weight: bold; flex: 1; }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .toggle-switch.on { background: #4caf50; }
    .toggle-switch.on::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 26px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle-status { font-size: 11px; color: #666; }

    /* Latch tools */
    .latch-tools {
      max-height: 100px;
      overflow-y: auto;
      font-size: 11px;
      font-family: monospace;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px;
      margin-top: 4px;
    }
    .latch-tools div { padding: 1px 0; color: #555; }
    .tunnel-url {
      font-size: 10px;
      color: #888;
      word-break: break-all;
      margin-top: 2px;
    }

    /* Debug panel */
    .debug-panel {
      display: none;
      margin-top: 8px;
      padding: 8px;
      background: #1a1a2e;
      color: #a0ffa0;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .debug-panel.visible { display: block; }
    .debug-panel .debug-error { color: #ff6b6b; }
    .debug-panel .debug-ok { color: #4ecca3; }
    .debug-panel .debug-info { color: #ffd460; }

    /* Gateway section */
    .gateway-section {
      margin-top: 8px;
      padding: 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .gateway-section input {
      width: 100%;
      padding: 4px 8px;
      font-size: 11px;
      font-family: monospace;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .gateway-section .gw-status {
      font-size: 11px;
      margin-top: 4px;
      font-family: monospace;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ddd;
      border-top-color: #2196f3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Double Control v2.1.0</h1>

  <h2>Tabs</h2>
  <div id="status" class="status">Loading tabs...</div>
  <div id="tabsList" class="tabs-list"></div>
  <button id="refreshBtn">Refresh Tabs</button>
  <button id="remoteDebugBtn" style="background:#ff9800;">Remote Debugging</button>

  <h2>MCP Servers (3000 / 3001)</h2>
  <div id="mcpStatus" class="mcp-status">Checking MCP servers...</div>

  <h2>Latch MCP (3939)</h2>
  <div id="latchStatus" class="mcp-status">Checking Latch MCP...</div>

  <!-- Toggle switch -->
  <div class="toggle-row">
    <span class="toggle-label">Latch MCP Service</span>
    <span class="toggle-status" id="latchToggleStatus">checking...</span>
    <button class="toggle-switch" id="latchToggle" title="Start/Stop Latch MCP"></button>
  </div>

  <div id="latchTunnel" class="tunnel-url"></div>
  <div id="latchTools" class="latch-tools" style="display:none;"></div>
  <button id="latchRefreshBtn">Refresh</button>
  <button id="latchDebugBtn" style="background:#673ab7;">Debug</button>
  <button id="openPanelBtn" style="background:#4caf50;">Open Panel</button>

  <!-- Debug panel -->
  <div id="latchDebugPanel" class="debug-panel"></div>

  <h2>Gateway (3002)</h2>
  <div class="gateway-section">
    <div id="gatewayStatus" class="gw-status">Checking gateway...</div>
    <input type="password" id="gatewayToken" placeholder="Gateway auth token (Bearer)" style="margin-top:6px;">
    <button id="saveTokenBtn" style="margin-top:4px;">Save Token</button>
    <button id="testGatewayBtn" style="margin-top:4px; background:#673ab7;">Test Gateway</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
