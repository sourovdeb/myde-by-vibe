<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Double Control</title>
  <style>
    body { width: 400px; height: 500px; padding: 10px; font-family: Arial, sans-serif; background: #f5f5f5; }
    h1 { font-size: 18px; margin: 0 0 15px 0; color: #333; }
    .tabs-list { max-height: 400px; overflow-y: auto; margin-bottom: 10px; }
    .tab-item { padding: 8px; margin: 5px 0; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
    .tab-item:hover { background: #e3f2fd; }
    .tab-item.active { background: #2196f3; color: white; border-color: #1976d2; }
    .tab-title { font-weight: bold; margin-bottom: 3px; }
    .tab-url { font-size: 12px; color: #666; word-break: break-all; }
    .status { padding: 10px; background: #4caf50; color: white; text-align: center; border-radius: 4px; margin-top: 10px; }
    button { padding: 8px 12px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1976d2; }
  </style>
</head>
<body>
  <h1>Double Control Extension</h1>
  <div id="status" class="status">Loading tabs...</div>
  <div id="tabsList" class="tabs-list"></div>
  <button id="refreshBtn">Refresh Tabs</button>
  <script src="popup.js"></script>
</body>
</html>
