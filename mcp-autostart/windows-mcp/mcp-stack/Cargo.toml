[package]
name = "mcp-stack"
version = "0.1.0"
edition = "2021"
description = "Supervisor for the Sourov local MCP stack: latch, mcp-bridge, node servers, cloudflared tunnels. Start/stop/status/configure/autostart with a RAM budget."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
