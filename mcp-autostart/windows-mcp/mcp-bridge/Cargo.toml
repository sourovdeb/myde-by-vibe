[package]
name = "mcp-bridge"
version = "0.1.0"
edition = "2021"
description = "Tiny Rust MCP bridge: cloud chats call local coding CLIs (claude/grok/vibe/pi) as tools"

[lib]
name = "mcp_bridge_lib"
path = "src/lib.rs"

[[bin]]
name = "mcp-bridge"
path = "src/main.rs"

[features]
default = []
tray = ["dep:tray-icon", "dep:windows-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.19", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
