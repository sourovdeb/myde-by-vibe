[package]
name = "mcp-bridge"
version = "0.1.0"
edition = "2021"
description = "Tiny Rust MCP bridge: cloud chats call local coding CLIs (claude/grok/vibe/pi) as tools"

[lib]
name = "mcp_bridge_lib"
path = "src/lib.rs"

[[bin]]
name = "mcp-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
