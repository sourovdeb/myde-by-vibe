[package]
name = "latch"
version = "0.1.0"
edition = "2021"
description = "Tiny local MCP bridge. Cloud chat reaches this PC only through a public https address."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
