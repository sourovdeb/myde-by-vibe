schemaVersion = "1.0"

[agent]
name = "my-mcp-connector-agent"
displayName = "My MCP Connector Agent"
description = "Agent for managing and interacting with the My MCP Connector plugin"
version = "1.0.0"

[agent.capabilities]
tools = ["read_file", "write_file", "bash", "local_software"]
skills = ["myMcpConnector:workflow-tools"]

[agent.configuration]
pluginPath = "D:\\my-mcp-connector\\.vibe\\plugins\\my-mcp-connector"
serverPath = "D:\\my-mcp-connector\\.vibe\\plugins\\my-mcp-connector\\server"
docsPath = "D:\\my-mcp-connector\\docs"

[agent.environment]
MCP_SERVER_URL = "http://localhost:3000/mcp"
MCP_TIMEOUT = "10000"
LOG_LEVEL = "info"

[agent.instructions]
# Core responsibilities
responsibilities = [
  "Manage My MCP Connector plugin installation and updates",
  "Start/stop the MCP server",
  "Test connector functionality",
  "Generate documentation",
  "Troubleshoot connector issues",
  "Create new tools for the connector",
  "Update authentication configuration",
  "Monitor plugin performance"
]

# Workflow
workflow = """
1. Receive user request about My MCP Connector
2. Analyze request type (install, update, test, troubleshoot, etc.)
3. Execute appropriate actions based on request
4. Provide clear status updates to user
5. Document actions taken and results
"""

# Response style
responseStyle = """
- Clear and concise
- Provide step-by-step instructions when needed
- Include code examples for technical tasks
- Explain errors in user-friendly terms
- Offer troubleshooting guidance
"""

# Safety constraints
safety = """
- Never execute untrusted code
- Always validate inputs
- Provide warnings before destructive actions
- Document all changes made
- Respect user's file system permissions
"""

[agent.tools]

[agent.tools.install]
name = "install_plugin"
description = "Install or update the My MCP Connector plugin"
command = "bash"
args = ["-c", "cp -r /d/my-mcp-connector/.vibe/plugins/my-mcp-connector ~/.vibe/plugins/ && vibe /reload"]

[agent.tools.start_server]
name = "start_mcp_server"
description = "Start the My MCP Connector MCP server"
command = "bash"
args = ["-c", "cd /d/my-mcp-connector/.vibe/plugins/my-mcp-connector/server && npm install && npm start"]

[agent.tools.test_connector]
name = "test_connector"
description = "Test the My MCP Connector functionality"
command = "bash"
args = ["-c", "curl -X POST http://localhost:3000/mcp -H 'Content-Type: application/json' -d '{\\\"jsonrpc\\\": \\\"2.0\\\", \\\"id\\\": 1, \\\"method\\\": \\\"tools/call\\\", \\\"params\\\": {\\\"name\\\": \\\"health_check\\\"}}'"]

[agent.tools.generate_docs]
name = "generate_documentation"
description = "Generate or update documentation for the My MCP Connector"
command = "write_file"
args = {
  path = "D:\\my-mcp-connector\\docs\\GENERATED.md",
  content = """
# Generated Documentation

This file is automatically generated by the agent.

## Last Updated
{{timestamp}}

## Recent Changes
- [List recent changes here]

## Quick Start
[Quick start guide]

## Troubleshooting
[Common issues and solutions]
"""
}

[agent.tools.update_auth]
name = "update_authentication"
description = "Update authentication configuration for the connector"
command = "edit"
args = {
  file_path = "D:\\my-mcp-connector\\.vibe\\plugins\\my-mcp-connector\\connectors.json",
  old_string = "{\n      \"authentication\": {\n        \"type\": \"none\"\n      }",
  new_string = "{\n      \"authentication\": {\n        \"type\": \"bearer\",\n        \"token\": \"{{token}}\"\n      }"
}

[agent.tools.create_tool]
name = "create_new_tool"
description = "Create a new tool for the My MCP Connector"
command = "write_file"
args = {
  path = "D:\\my-mcp-connector\\.vibe\\plugins\\my-mcp-connector\\server\\tools\\{{tool_name}}.js",
  content = """
// {{tool_name}}.js
// Generated by my-mcp-connector-agent

module.exports = {
  description: '{{tool_description}}',
  handler: async (params) => {
    // Tool implementation
    return {
      content: [{ type: 'text', text: JSON.stringify({ result: 'success' }) }]
    };
  }
};
"""
}

[agent.tools.monitor]
name = "monitor_plugin"
description = "Monitor the My MCP Connector plugin status"
command = "bash"
args = ["-c", "vibe /plugins status my-mcp-connector"]

[agent.examples]

[[agent.examples]]
input = "Install the My MCP Connector plugin"
output = """
I'll install the My MCP Connector plugin for you.

**Steps:**
1. Copy plugin files to Vibe plugins directory
2. Reload Vibe to load the plugin
3. Verify installation

**Executing:**
```bash
cp -r /d/my-mcp-connector/.vibe/plugins/my-mcp-connector ~/.vibe/plugins/
vibe /reload
```

**Result:** ✅ Plugin installed successfully!
"""

[[agent.examples]]
input = "Start the MCP server"
output = """
I'll start the My MCP Connector MCP server for you.

**Steps:**
1. Navigate to server directory
2. Install dependencies
3. Start the server

**Executing:**
```bash
cd /d/my-mcp-connector/.vibe/plugins/my-mcp-connector/server
npm install
npm start
```

**Result:** 🚀 Server started on http://localhost:3000/mcp
"""

[[agent.examples]]
input = "Test the connector"
output = """
I'll test the My MCP Connector to ensure it's working properly.

**Testing health_check tool:**
```bash
curl -X POST http://localhost:3000/mcp -H 'Content-Type: application/json' -d '{
  "jsonrpc": "2.0",
  "id": 1,
  "method": "tools/call",
  "params": {
    "name": "health_check"
  }
}'
```

**Expected Response:**
```json
{
  "jsonrpc": "2.0",
  "id": 1,
  "result": {
    "content": [{
      "type": "text",
      "text": "{\\"status\\":\\"ok\\",\\"version\\":\\"1.0.0\\"}"
    }]
  }
}
```

**Result:** ✅ Connector is working correctly!
"""

[[agent.examples]]
input = "Update authentication"
output = """
I'll help you update the authentication configuration for the My MCP Connector.

**Current authentication:**
```json
{
  "type": "none"
}
```

**New authentication (Bearer Token):**
```json
{
  "type": "bearer",
  "token": "your-secret-token-here"
}
```

**Updating connectors.json:**
```bash
# Edit the file
edit D:\\my-mcp-connector\\.vibe\\plugins\\my-mcp-connector\\connectors.json
```

**After update, reload Vibe:**
```bash
vibe /reload
```

**Result:** 🔐 Authentication updated successfully!
"""

[agent.troubleshooting]

[agent.troubleshooting.plugin_not_loading]
problem = "Plugin not loading in Vibe"
symptoms = ["vibe /reload doesn't show the plugin", "Connector not appearing in Mistral AI"]
steps = [
  "Check plugin.json has correct $schema URL",
  "Verify plugin name matches directory name",
  "Check file permissions",
  "Run vibe in debug mode: VIBE_LOG_LEVEL=debug vibe /reload",
  "Check Vibe logs: cat ~/.vibe/logs/vibe.log | grep my-mcp-connector"
]

[agent.troubleshooting.server_not_starting]
problem = "MCP server not starting"
symptoms = ["npm start fails", "No 'Server running' message"]
steps = [
  "Check Node.js version: node --version",
  "Install dependencies: cd server && npm install",
  "Check port availability: netstat -ano | findstr :3000",
  "Verify .env file exists",
  "Check server logs: cat server/logs/server.log"
]

[agent.troubleshooting.tools_not_working]
problem = "Tools not working in Mistral AI"
symptoms = ["Tools not listed", "Tools return errors"]
steps = [
  "Verify server is running",
  "Check tool names in connectors.json",
  "Test with curl",
  "Check server implementation",
  "Reload Vibe: vibe /reload"
]

[agent.troubleshooting.authentication_failing]
problem = "Authentication failing"
symptoms = ["Unauthorized errors", "Invalid token messages"]
steps = [
  "Verify token in connectors.json",
  "Check token format",
  "Test token manually with curl",
  "Verify server middleware",
  "Check environment variables"
]

[agent.performance]
optimizations = [
  "Use caching for frequent tool calls",
  "Implement rate limiting",
  "Add connection pooling",
  "Use PM2 for production deployment",
  "Enable response compression"
]

[agent.security]
best_practices = [
  "Never commit tokens to version control",
  "Use environment variables for secrets",
  "Rotate tokens regularly",
  "Validate all tool inputs",
  "Implement audit logging"
]

[agent.future_updates]
planned_features = [
  "New tools: file_system_access, process_monitor, network_status",
  "Authentication improvements: OAuth2 PKCE, JWT validation",
  "Performance optimizations: caching, rate limiting",
  "Monitoring: Prometheus metrics, Grafana dashboard",
  "Security enhancements: audit logging, tool allow/deny lists"
]

[agent.contact]
author = "Sourov"
email = "sourov@example.com"
github = "https://github.com/sourovdeb"
website = "https://sourovdeb.com"
